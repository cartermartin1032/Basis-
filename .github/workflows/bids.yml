name: Update posted bids

on:
  schedule:
    # Hourly 13:00–22:00 UTC, Monday–Friday (US Central trading-day hours).
    - cron: '0 13-22 * * 1-5'
  workflow_dispatch:
  # A push of the fetcher or sealer also runs it once on the runner.
  # Data-only commits from this job do not match these paths, so they do not loop.
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch_bids.py'
      - 'scripts/seal_bids.py'
      - 'scripts/publish_bids.py'
      - '.github/workflows/bids.yml'

# contents: write so this job can commit bid data. Pages deploy stays in this
# workflow because a push made with GITHUB_TOKEN does not start pages.yml.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # Missing secret: keep the unlocked plaintext board and warn.
      # Secret present: seal, and do not publish plaintext.
      - name: Choose publish mode
        id: mode
        env:
          BIDS_PASSCODE: ${{ secrets.BIDS_PASSCODE }}
        run: |
          if [ -z "${BIDS_PASSCODE}" ]; then
            echo "::warning title=BIDS_PASSCODE missing::Posted bids stay unlocked. Add a repository Actions secret named BIDS_PASSCODE at https://github.com/cartermartin1032/Basis-/settings/secrets/actions/new to seal them."
            echo "mode=plain" >> "$GITHUB_OUTPUT"
          else
            echo "BIDS_PASSCODE is set. Sealing posted bids."
            echo "mode=sealed" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch cash bids
        run: python3 scripts/fetch_bids.py --out "${RUNNER_TEMP}/bids.csv"

      - name: Publish plaintext bids
        if: steps.mode.outputs.mode == 'plain'
        run: |
          python3 scripts/publish_bids.py "${RUNNER_TEMP}/bids.csv"
          rm -f data/bids.enc.json
          if [ ! -s data/bids_latest.json ] || [ ! -s data/bids_history.csv ]; then
            echo "::error title=Plaintext bids missing::data/bids_latest.json or data/bids_history.csv was not written."
            exit 1
          fi

      - name: Install sealer
        if: steps.mode.outputs.mode == 'sealed'
        run: python3 -m pip install --disable-pip-version-check cryptography

      - name: Encrypt posted bids
        if: steps.mode.outputs.mode == 'sealed'
        env:
          BIDS_PASSCODE: ${{ secrets.BIDS_PASSCODE }}
        run: python3 scripts/seal_bids.py "${RUNNER_TEMP}/bids.csv"

      - name: Refuse plaintext publish
        if: steps.mode.outputs.mode == 'sealed'
        run: |
          if [ -e data/bids_latest.json ] || [ -e data/bids_history.csv ]; then
            echo "::error title=Plaintext bids still present::data/bids_latest.json or data/bids_history.csv is still in the worktree. Refusing to deploy."
            exit 1
          fi
          if [ ! -s data/bids.enc.json ]; then
            echo "::error title=Encrypted bids missing::data/bids.enc.json was not written. Refusing to deploy."
            exit 1
          fi

      - name: Commit bid data
        env:
          PUBLISH_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PUBLISH_MODE" = "sealed" ]; then
            git add data/bids.enc.json
            git rm -f --ignore-unmatch data/bids_latest.json data/bids_history.csv
          else
            git add data/bids_latest.json data/bids_history.csv
            git rm -f --ignore-unmatch data/bids.enc.json
          fi
          if git diff --cached --quiet; then
            echo "No bid changes to commit."
          else
            git commit -m "Update posted cash bids"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
